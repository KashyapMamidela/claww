    const names = ['Home cooked', 'Hostel or mess', 'PG or tiffin', 'Office canteen', 'Eating out', 'I cook myself'];
    const out = {};
    names.forEach((n, i) => { out['w' + i] = { ...look(s.where.includes(n)), pick: () => this.setState({ where: flip(s.where, n) }) }; });
    out.tools = ['Full kitchen', 'Gas stove', 'Kettle', 'Microwave', 'Rice cooker', 'Nothing'].map((n) => ({ n, cls: s.tools.includes(n) ? 'chip-on' : '', pick: () => this.setState({ tools: flip(s.tools, n) }) }));
    out.budget = ['₹100', '₹200', '₹350', 'No limit'].map((n) => { const b = s.budget === n; return { n, bg: b ? 'linear-gradient(135deg, #166534, #22C55E)' : 'transparent', c: b ? '#FFFFFF' : '#9A9AA3', sh: b ? '0 2px 8px rgba(34,197,94,0.4)' : 'none', pick: () => this.setState({ budget: n }) }; });
    out.diet = ['Vegetarian', 'Eggetarian', 'Non-veg', 'Vegan', 'Jain'].map((n) => ({ n, cls: s.diet === n ? 'chip-on' : '', pick: () => this.setState({ diet: n }) }));
    return out;
  }
}
