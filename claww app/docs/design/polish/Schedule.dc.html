<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding: days, time and body</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=Caveat:wght@500;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
button{font-family:Inter,system-ui,sans-serif}
.scr{position:relative;overflow:hidden;color:#FFFFFF;font-family:Inter,system-ui,sans-serif;background:radial-gradient(120% 34% at 50% -4%,var(--glow),transparent 72%),#050505}
.scr::before{content:"";position:absolute;inset:0;background-image:url(/_blob/4e9e6ff79a1ba60f0501b64e43afb1e9);background-size:256px 256px;opacity:.07;pointer-events:none;z-index:0}
.card{position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(180deg,#1A1A1D 0%,#131315 100%);border:1px solid rgba(255,255,255,0.09);box-shadow:inset 0 1px 0 rgba(255,255,255,0.07),inset 0 -1px 0 rgba(0,0,0,0.55),0 22px 34px -22px rgba(0,0,0,0.95),0 2px 6px rgba(0,0,0,0.35)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;background-image:url(/_blob/4e9e6ff79a1ba60f0501b64e43afb1e9);background-size:256px 256px;opacity:.14;mix-blend-mode:overlay;pointer-events:none}
.lbl{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:#E4E4E7}
.lbl i{display:block;width:7px;height:7px;border-radius:4px;background:#3B82F6;box-shadow:0 0 8px #3B82F6}
.seg{display:flex;padding:3px;gap:3px;border-radius:14px;background:#0B0B0C;border:1px solid rgba(255,255,255,0.08);box-shadow:inset 0 1px 3px rgba(0,0,0,0.6)}
.chip{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:22px;background:linear-gradient(180deg,#19191C,#131315);border:1px solid rgba(255,255,255,0.09);box-shadow:inset 0 1px 0 rgba(255,255,255,0.06);color:#C4C4CC;font-size:15px;font-weight:600;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;font-weight:800;color:#FFFFFF;cursor:pointer}
.btn-p{height:54px;border-radius:16px;font-size:17px;background:linear-gradient(135deg,#1D4ED8,#3B82F6);box-shadow:0 10px 24px -8px rgba(59,130,246,0.65),inset 0 1px 0 rgba(255,255,255,0.22)}
.pen{font-family:Caveat,cursive;font-weight:700;color:#FFFFFF;text-shadow:0 0 14px rgba(255,255,255,0.35),0 1px 0 rgba(0,0,0,0.6)}
</style>
</helmet>
<div class="scr" style="width: 390px; height: 844px; --glow: rgba(59,130,246,0.16)">
  <div style="position: absolute; top: 0; left: 0; right: 0; z-index: 5; height: 60px; padding: 0 12px; display: flex; align-items: center; gap: 8px; background: rgba(5,5,5,0.55); backdrop-filter: blur(22px); border-bottom: 1px solid rgba(255,255,255,0.08)">
    <a href="Train.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
    <div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 800">Set up your plan</span><span style="font-size: 13px; color: #9A9AA3">Step 3 of 4</span></div>
  </div>
  <main style="position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; gap: 18px; padding: 76px 16px 34px">
    <div style="display: flex; gap: 4px" aria-hidden="true">
      <span style="flex: 1; height: 4px; border-radius: 2px; background: #3B82F6"></span>
      <span style="flex: 1; height: 4px; border-radius: 2px; background: #3B82F6"></span>
      <span style="flex: 1; height: 4px; border-radius: 2px; background: #3B82F6; box-shadow: 0 0 10px #3B82F6"></span>
      <span style="flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.1)"></span>
    </div>
    <h1 style="margin: 0; font-size: 32px; line-height: 38px; font-weight: 900; letter-spacing: -0.8px">When can you train?</h1>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span class="lbl"><i></i>Days you train</span>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <button type="button" aria-pressed="{{d.on}}" onClick="{{d.toggle}}" aria-label="{{d.full}}" style="{{d.style}}">{{d.l}}</button>
        </sc-for>
      </div>
      <span style="font-size: 13px; color: #9A9AA3">{{daysLine}}</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span class="lbl"><i></i>Time each day</span>
      <div class="seg">
        <sc-for list="{{lens}}" as="l" hint-placeholder-count="4">
          <button type="button" onClick="{{l.pick}}" style="{{l.style}}">{{l.n}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span class="lbl"><i></i>Anything that hurts?</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <span class="chip" style="background: linear-gradient(135deg,#1D4ED8,#3B82F6); color: #FFFFFF; border-color: rgba(96,165,250,0.6); box-shadow: 0 4px 12px -4px rgba(59,130,246,0.7)">Nothing</span>
        <span class="chip">Knee</span><span class="chip">Lower back</span><span class="chip">Shoulder</span><span class="chip">Wrist</span>
      </div>
    </div>

    <div class="card" style="padding: 14px 16px; display: flex; align-items: center; gap: 12px">
      <div style="position: relative; flex-grow: 1"><p style="margin: 0; font-size: 13px; color: #9A9AA3">About you</p><p style="margin: 2px 0 0; font-size: 17px; font-weight: 700">175 cm · 68 kg · 20 years</p></div>
      <span style="position: relative; min-height: 44px; display: flex; align-items: center; font-size: 15px; font-weight: 700; color: #60A5FA">Edit</span>
    </div>

    <p class="pen" style="margin: 0 4px; font-size: 25px; transform: rotate(-1.5deg)">{{note}}</p>
    <a href="PlanStory.dc.html" class="btn btn-p" style="margin-top: auto">Build my plan</a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { days: [true, false, true, false, true, true, false], len: 45 };
  }
  renderVals() {
    const names = [['M', 'Monday'], ['T', 'Tuesday'], ['W', 'Wednesday'], ['T', 'Thursday'], ['F', 'Friday'], ['S', 'Saturday'], ['S', 'Sunday']];
    const sel = this.state.days;
    const days = names.map((n, i) => ({
      l: n[0], full: n[1], on: sel[i] ? 'true' : 'false',
      style: 'height: 48px; border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer; ' +
        (sel[i] ? 'border: 1px solid rgba(96,165,250,0.6); color: #FFFFFF; background: linear-gradient(150deg, rgba(29,78,216,0.65), rgba(59,130,246,0.3)); box-shadow: 0 10px 18px -10px rgba(59,130,246,0.95), inset 0 1px 0 rgba(255,255,255,0.16)'
                : 'border: 1px solid rgba(255,255,255,0.08); color: #A1A1AA; background: linear-gradient(180deg, #1A1A1D, #131315)'),
      toggle: () => { const next = sel.slice(); next[i] = !next[i]; this.setState({ days: next }); }
    }));
    const count = sel.filter(Boolean).length;
    const lens = [30, 45, 60, 75].map((n) => ({
      n: n + ' min',
      style: 'flex: 1; height: 40px; border: 0; border-radius: 11px; font-size: 15px; font-weight: 700; cursor: pointer; ' +
        (this.state.len === n ? 'color: #FFFFFF; background: linear-gradient(135deg, #1D4ED8, #3B82F6); box-shadow: 0 2px 8px rgba(59,130,246,0.45)' : 'color: #9A9AA3; background: transparent'),
      pick: () => this.setState({ len: n })
    }));
    const note = count < 2 ? 'two days is a good start' : count > 5 ? 'leave a day to rest' : count + ' days, with rest between';
    return { days, lens, daysLine: count + ' days a week. Tap to change.', note };
  }
}
</script>
</body>
</html>
