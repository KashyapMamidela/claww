<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=Caveat:wght@500;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
button{font-family:Inter,system-ui,sans-serif}
.scr{position:relative;overflow:hidden;color:#FFFFFF;font-family:Inter,system-ui,sans-serif;background:radial-gradient(90% 40% at 50% 30%,rgba(59,130,246,0.22),transparent 72%),#050505}
.scr::before{content:"";position:absolute;inset:0;background-image:url(/_blob/4e9e6ff79a1ba60f0501b64e43afb1e9);background-size:256px 256px;opacity:.07;pointer-events:none;z-index:0}
.card{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(180deg,#1A1A1D 0%,#131315 100%);border:1px solid rgba(255,255,255,0.09);box-shadow:inset 0 1px 0 rgba(255,255,255,0.07),inset 0 -1px 0 rgba(0,0,0,0.55),0 22px 34px -22px rgba(0,0,0,0.95)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;background-image:url(/_blob/4e9e6ff79a1ba60f0501b64e43afb1e9);background-size:256px 256px;opacity:.14;mix-blend-mode:overlay;pointer-events:none}
.step{width:56px;height:56px;border-radius:18px;border:1px solid rgba(255,255,255,0.12);background:#0B0B0C;box-shadow:inset 0 2px 6px rgba(0,0,0,0.7);color:#FFFFFF;font-size:26px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;font-weight:800;color:#FFFFFF;cursor:pointer}
.btn-p{height:58px;border-radius:18px;font-size:18px;background:linear-gradient(135deg,#1D4ED8,#3B82F6);box-shadow:0 12px 28px -8px rgba(59,130,246,0.75),inset 0 1px 0 rgba(255,255,255,0.22)}
.pen{font-family:Caveat,cursive;font-weight:700;color:#FFFFFF;text-shadow:0 0 14px rgba(255,255,255,0.35),0 1px 0 rgba(0,0,0,0.6)}
</style>
</helmet>
<div class="scr" style="width: 390px; height: 844px">
  <main style="position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; gap: 16px; padding: 54px 16px 34px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="Workouts.dc.html" aria-label="Close" style="width: 44px; height: 44px; margin-left: -8px; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
      <div style="flex-grow: 1; display: flex; gap: 4px" aria-label="Move 1 of 5">
        <span style="flex: 1; height: 4px; border-radius: 2px; background: #3B82F6; box-shadow: 0 0 8px #3B82F6"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12)"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12)"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12)"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12)"></span>
      </div>
      <span style="font-size: 15px; font-weight: 700; color: #9A9AA3">12:40</span>
    </div>

    <div style="text-align: center; margin-top: 10px">
      <p style="margin: 0; font-size: 15px; color: #93C5FD; font-weight: 600">Chest · move 1 of 5</p>
      <h1 style="margin: 4px 0 0; font-size: 32px; line-height: 38px; font-weight: 900; letter-spacing: -0.8px">Bench press</h1>
      <p class="pen" style="margin: 6px 0 0; font-size: 24px; color: #FDE68A; text-shadow: 0 0 12px rgba(253,230,138,0.5)">last time 60 kg felt easy, try 62.5</p>
    </div>

    <div style="display: flex; justify-content: center; gap: 10px">
      <sc-for list="{{sets}}" as="s" hint-placeholder-count="4">
        <span style="{{s.style}}">{{s.t}}</span>
      </sc-for>
    </div>

    <div class="card" style="padding: 20px">
      <div style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
          <span style="font-size: 13px; color: #9A9AA3">Weight</span>
          <span style="font-size: 44px; line-height: 48px; font-weight: 900; letter-spacing: -1px">{{kg}}<span style="font-size: 17px; color: #9A9AA3; font-weight: 700"> kg</span></span>
          <div style="display: flex; gap: 8px"><button type="button" class="step" onClick="{{kgDown}}" aria-label="Less weight">−</button><button type="button" class="step" onClick="{{kgUp}}" aria-label="More weight">+</button></div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
          <span style="font-size: 13px; color: #9A9AA3">Reps</span>
          <span style="font-size: 44px; line-height: 48px; font-weight: 900; letter-spacing: -1px">{{reps}}</span>
          <div style="display: flex; gap: 8px"><button type="button" class="step" onClick="{{repDown}}" aria-label="Fewer reps">−</button><button type="button" class="step" onClick="{{repUp}}" aria-label="More reps">+</button></div>
        </div>
      </div>
    </div>

    <sc-if value="{{asking}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <p style="margin: 0; text-align: center; font-size: 17px; font-weight: 700">How did that set feel?</p>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{feels}}" as="f" hint-placeholder-count="3">
            <button type="button" onClick="{{f.pick}}" class="btn" style="{{f.style}}">{{f.n}}</button>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{logging}}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{doneSet}}" class="btn btn-p" style="margin-top: auto">{{cta}}</button>
    </sc-if>
    <sc-if value="{{finished}}" hint-placeholder-val="{{ false }}">
      <a href="Rest.dc.html" class="btn btn-p" style="margin-top: auto">Rest, then shoulder press</a>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kg: 62.5, reps: 8, done: [], asking: false };
  }
  renderVals() {
    const s = this.state;
    const sets = [0, 1, 2, 3].map((i) => {
      const d = s.done[i];
      const cur = i === s.done.length && !s.asking;
      return {
        t: d ? d.kg + '×' + d.reps : 'Set ' + (i + 1),
        style: 'min-width: 72px; height: 36px; padding: 0 10px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; ' +
          (d ? 'color: #4ADE80; background: rgba(34,197,94,0.14); border: 1px solid rgba(34,197,94,0.4)' : cur ? 'color: #FFFFFF; background: rgba(59,130,246,0.22); border: 1px solid rgba(96,165,250,0.7); box-shadow: 0 0 14px -2px rgba(59,130,246,0.8)' : 'color: #71717A; background: #111113; border: 1px solid rgba(255,255,255,0.06)')
      };
    });
    const finished = s.done.length >= 4 && !s.asking;
    const feels = ['Easy', 'Right', 'Hard'].map((n, i) => ({
      n,
      style: 'height: 52px; border-radius: 15px; font-size: 16px; ' + ['background: rgba(34,197,94,0.16); color: #4ADE80; border: 1px solid rgba(34,197,94,0.4)', 'background: rgba(59,130,246,0.18); color: #93C5FD; border: 1px solid rgba(96,165,250,0.45)', 'background: rgba(251,146,60,0.16); color: #FDBA74; border: 1px solid rgba(251,146,60,0.4)'][i],
      pick: () => this.setState({ asking: false })
    }));
    return {
      sets, feels, finished, asking: s.asking, logging: !s.asking && !finished,
      kg: s.kg, reps: s.reps,
      cta: 'Done · set ' + (s.done.length + 1) + ' of 4',
      kgUp: () => this.setState({ kg: s.kg + 2.5 }),
      kgDown: () => this.setState({ kg: Math.max(0, s.kg - 2.5) }),
      repUp: () => this.setState({ reps: s.reps + 1 }),
      repDown: () => this.setState({ reps: Math.max(1, s.reps - 1) }),
      doneSet: () => this.setState({ done: s.done.concat({ kg: s.kg, reps: s.reps }), asking: true })
    };
  }
}
</script>
</body>
</html>
